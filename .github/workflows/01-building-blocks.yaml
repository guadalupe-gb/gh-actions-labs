name: 01 - Building Blocks
on: 
  push:
    branches: [ "main" ]
jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Say hello
              run: echo "Hello, world I'm in Dev Branch!"
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Failed step
              run: |
                echo "I will fail"
                exit 0
            - name: Say goodbye
              run: echo "Goodbye!"
