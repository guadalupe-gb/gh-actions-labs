name: 08 - Using Variables
run-name: "Overwritten variables run: #${{github.run_number}}"
on:
    #push:
    workflow_dispatch:
env:
    WORKFLOW_VAR: "Workflow env var"
    OVERWRITTEN: "WF env var overwritten"

jobs:
    echo:
        runs-on: ubuntu-latest
        env:
          JOB_VAR: "Job env var"
          OVERWRITTEN: "Job var overwritten"
        steps:
          - name: Print Env Variables
            env:
              STEP_VAR: "Step env var"
              step_var2: "step var 2"
            run: |
              echo "Step var: ${{env.STEP_VAR}}"
              echo "step var 2: $env.step_var2"
              echo "job var: ${{env.JOB_VAR}}"
              echo "WF var: ${{env.WORKFLOW_VAR}}"
              echo "WF overwritten var: ${{env.OVERWRITTEN}}"
          - name: Overwrite Job Variable
            env:
              OVERWRITTEN: "overwritten at the step level"
            run: |
              echo "step env var: ${{env.OVERWRITTEN}}"
