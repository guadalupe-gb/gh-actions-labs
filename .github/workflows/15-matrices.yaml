name: 15 - Working with Matrices
on: 
  workflow_dispatch:
    inputs:
      fail-fast:
        type: boolean
        default: true


jobs:
    backwards-compatibility:
        name: ${{matrix.os}}-${{matrix.node_version}}
        runs-on: ${{matrix.os}}
        strategy:     
          fail-fast: ${{ inputs.fail-fast }}
          matrix:
            node_version: [18.x, 20.x, 21.x]
            os: 
              - ubuntu-latest
              - ubuntu-24.04
            include:
              - os: ubuntu-latest
                node_version: 16.x
              - os: ubuntu-latest
                node-version: 21.x
                tag: experimental
        steps:
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: ${{matrix.node_version}}
            - name: Display tag
              run: echo "${{matrix.tag}} - ${{matrix.os}} - ${{matrix.node_version}}"
            - name: Fail if experimental
              if: ${{ matrix.tag == 'experimental' }}
              run: exit 1
            - name: Perform some tests
              run: |
                echo "Running tests on OS ${{matrix.os}} and NodeJS ${{matrix.node_version}}"
                sleep 10
            - name: Upload test results
              run: echo "Uploading test results"
                
    