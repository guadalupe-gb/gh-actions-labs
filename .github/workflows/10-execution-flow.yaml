name: 10 - Controlling the Execution Flow
on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                type: boolean
                default: false

jobs:
    lint-build-1:
        runs-on: ubuntu-latest
        steps:
            - name: Lint and build
              id: lint-build-1
              run: echo "Linting and building project" 
    unit-tests-2:
        runs-on: ubuntu-latest
        steps:
            - name: Running unit tests
              id: unit-tests-2
              run: echo "Running tests..."
            - name: Failing tests
              if: ${{! inputs.pass-unit-tests}} 
              run: exit 1
    deploy-nonprod-3:
        runs-on: ubuntu-latest
        needs:
            - lint-build-1
            - unit-tests-2
        steps:
            - name: Deploying to nonprod
              id: deploy-nonprod-3
              if: ${{ success() }}
              run: echo "Deploying to nonprod...."
    e2e-tests-4:
        runs-on: ubuntu-latest
        needs:
            - deploy-nonprod-3
        if: ${{ success() }}
        steps:
            - name: Running E2E tests
              id: e2e-tests-4
              run: echo "Running E2E tests"
    load-tests-5:
        runs-on: ubuntu-latest
        needs:
            - deploy-nonprod-3
        if: ${{ success()}}
        steps:
            - name: Running load tests
              id: load-tests-5
              run: echo "Running load tests"
    deploy-prod-6:
        runs-on: ubuntu-latest
        needs:
            - e2e-tests-4
            - load-tests-5
        if: ${{ success() }}
        steps:
            - name: Deploying to prod
              id: deploy-prod-6
              run: echo "Deploying to prod..."