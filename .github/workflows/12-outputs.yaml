name: 12 - Working with Outputs
on:
    workflow_dispatch:
        inputs:
            build-status:
                type: choice
                options:
                    - success
                    - failure
                default: success

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            mystatus: ${{steps.mybuild.outputs.STATUS}}
            output1: ${{steps.mybuild.outputs.OUTPUT1}}
        steps:
            - name: Print GITHUB_OUTPUT path
              run: echo "$GITHUB_OUTPUT"
            - name: Build
              id: mybuild
              run: |
                echo "STATUS=${{inputs.build-status}}" >> "$GITHUB_OUTPUT"
                echo "OUTPUT1= value1" >> "$GITHUB_OUTPUT"
                echo "output2= value2" >> "$GITHUB_OUTPUT"
                cat "$GITHUB_OUTPUT"
            - name: Step with mistake
              run: |
                echo "mistake=true" >> "$GITHUB_OUTPUT"
                cat "$GITHUB_OUTPUT"


    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: ${{ needs.build.outputs.mystatus == 'success'}}
        steps:
            - name: Deploy
              run: echo "Deploying"
            - name: Print Outputs
              run: echo "${{needs.build.outputs.output1}}"